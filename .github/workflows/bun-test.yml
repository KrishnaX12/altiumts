name: Bun Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run download-references
      - run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/svg/ti-tmds62levm-top-layer.test.ts

      - uses: actions/upload-artifact@v4
        with:
          name: ti-top-layer-snapshot
          path: tests/svg/__snapshots__/ti-tmds62levm-top-layer.snap.svg
