    <g data-record="28"><defs><clipPath id="altium-text-frame-UBSZWHLP"><rect x="222.5" y="762.5" width="250" height="20"/></clipPath></defs><text x="224" y="776" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-UBSZWHLP)"><tspan x="224" dy="0">Recommendations</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-QZDYVISA"><rect x="502.5" y="432.5" width="260" height="70"/></clipPath></defs><text x="504" y="446" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-QZDYVISA)"><tspan x="504" dy="0">We have customer requesting for</tspan><tspan x="504" dy="13.8">Altium files and using the .ALG</tspan><tspan x="504" dy="13.8">files. The .ALG file is an</tspan><tspan x="504" dy="13.8">intermediate converted file</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-QRGTJQXI"><rect x="502.5" y="482.5" width="260" height="70"/></clipPath></defs><text x="504" y="496" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-QRGTJQXI)"><tspan x="504" dy="0">The Altium converted schematics and</tspan><tspan x="504" dy="13.8">PCB files provided has most of the</tspan><tspan x="504" dy="13.8">constraints translated and close</tspan><tspan x="504" dy="13.8">the Orcad/Allegro design files</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-GWZJKZKJ"><rect x="502.5" y="542.5" width="260" height="30"/></clipPath></defs><text x="504" y="556" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-GWZJKZKJ)"><tspan x="504" dy="0">schematic, layout , footprint</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-PLJSUCKK"><rect x="502.5" y="582.5" width="260" height="30"/></clipPath></defs><text x="504" y="596" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-PLJSUCKK)"><tspan x="504" dy="0">The simulations have been performed</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-AUQLVQKB"><rect x="502.5" y="622.5" width="260" height="40"/></clipPath></defs><text x="504" y="636" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-AUQLVQKB)"><tspan x="504" dy="0">Refer to</tspan><tspan x="504" dy="13.8">Proc180E1-1_Altium_Folders_Files_List</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-DKWWXPOE"><rect x="500.5" y="677.5" width="260" height="70"/></clipPath></defs><text x="502" y="691" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-DKWWXPOE)"><tspan x="502" dy="0">The required reviews for the</tspan><tspan x="502" dy="13.8">converted files have been provided.</tspan><tspan x="502" dy="13.8">The boards have not been built and</tspan><tspan x="502" dy="13.8">tested. Orcad/Allegro design-based</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-DJTAIBER"><rect x="502.5" y="752.5" width="260" height="70"/></clipPath></defs><text x="504" y="766" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-DJTAIBER)"><tspan x="504" dy="0">Customer can use the files to make</tspan><tspan x="504" dy="13.8">the required updates. The</tspan><tspan x="504" dy="13.8">recommendation is for customer to</tspan><tspan x="504" dy="13.8">perform a detailed review to ensure</tspan></text></g>
    <g data-record="28"><defs><clipPath id="altium-text-frame-PUIJZZFO"><rect x="532.5" y="332.5" width="260" height="20"/></clipPath></defs><text x="534" y="346" fill="#1f2937" text-anchor="start" font-family="Courier New" font-size="12" font-style="normal" font-weight="normal" text-decoration="none" clip-path="url(#altium-text-frame-PUIJZZFO)"><tspan x="534" dy="0">Comments</tspan></text></g>
